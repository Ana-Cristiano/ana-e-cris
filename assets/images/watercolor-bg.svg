<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Organic watercolor edge filter -->
    <filter id="wc" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.015" numOctaves="4" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="90" xChannelSelector="R" yChannelSelector="G" result="disp"/>
      <feGaussianBlur in="disp" stdDeviation="6"/>
    </filter>

    <!-- Paper grain -->
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="grain"/>
      <feColorMatrix in="grain" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.04"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>

    <radialGradient id="mint" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#c9e0d8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c9e0d8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sage" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#b7ccb2" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#b7ccb2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#cfe1e8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#cfe1e8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cream" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#efe6d6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#efe6d6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="peach" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#e8dcc8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#e8dcc8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Warm cream base -->
  <rect width="1200" height="1600" fill="#f5f1e9"/>

  <!-- Soft watercolor clouds with organic displaced edges -->
  <g filter="url(#wc)">
    <ellipse cx="120" cy="140" rx="260" ry="220" fill="url(#mint)"/>
    <ellipse cx="1050" cy="90" rx="280" ry="230" fill="url(#blue)"/>
    <ellipse cx="1120" cy="520" rx="240" ry="260" fill="url(#sage)"/>
    <ellipse cx="90" cy="620" rx="250" ry="240" fill="url(#cream)"/>
    <ellipse cx="600" cy="400" rx="300" ry="200" fill="url(#mint)" opacity="0.5"/>
    <ellipse cx="150" cy="1050" rx="270" ry="250" fill="url(#sage)"/>
    <ellipse cx="1080" cy="1000" rx="260" ry="240" fill="url(#blue)"/>
    <ellipse cx="650" cy="1150" rx="320" ry="220" fill="url(#peach)"/>
    <ellipse cx="1100" cy="1480" rx="280" ry="240" fill="url(#mint)"/>
    <ellipse cx="120" cy="1500" rx="260" ry="230" fill="url(#cream)"/>
    <ellipse cx="600" cy="800" rx="360" ry="240" fill="url(#cream)" opacity="0.6"/>
  </g>
</svg>
