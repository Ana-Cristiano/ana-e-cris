<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 520" fill="none">
  <defs>
    <filter id="watercolor" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="8" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="5" xChannelSelector="R" yChannelSelector="G" result="softEdge"/>
      <feGaussianBlur in="softEdge" stdDeviation="0.55"/>
    </filter>
    <filter id="pigment" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.18" numOctaves="2" seed="14" result="grain"/>
      <feColorMatrix in="grain" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.1"/></feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <linearGradient id="leafA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b5c8ae"/>
      <stop offset="1" stop-color="#6e8b6c"/>
    </linearGradient>
    <linearGradient id="leafB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c6d5bd"/>
      <stop offset="1" stop-color="#819d7c"/>
    </linearGradient>
    <linearGradient id="leafC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fb796"/>
      <stop offset="1" stop-color="#5f7a5e"/>
    </linearGradient>
    <path id="oliveLeaf" d="M0 0 C-10 -20 -9 -50 0 -76 C9 -50 10 -20 0 0Z"/>
  </defs>

